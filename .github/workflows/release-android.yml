name: Release Android AAB

# Produces the artifact Google Play actually accepts: a signed Android App
# Bundle (.aab) with a fresh version code. The debug APK from
# build-android.yml is for local testing only — Play rejects debuggable and
# debug-signed uploads.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    - upload keystore, base64-encoded
#                                (base64 -w0 upload-keystore.jks)
#   ANDROID_KEYSTORE_PASSWORD  - keystore password
#   ANDROID_KEY_ALIAS          - key alias inside the keystore
#   ANDROID_KEY_PASSWORD       - password for that key

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name shown in Play (e.g. 1.0.1)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: Build signed release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync web assets to Android project (Capacitor)
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform + build tools
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" 2>&1 | tail -5

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Fail early with a readable message rather than emitting an unsigned
      # bundle that Play would reject on upload.
      - name: Verify signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]      || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # github.run_number is monotonic per workflow, so each run gets a version
      # code Play has not seen before.
      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Via env rather than inline ${{ }} so the input cannot break out of
          # the shell command.
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_NAME="${INPUT_VERSION_NAME:-1.0.$RUN_NUMBER}"
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -PappVersionCode="$RUN_NUMBER" \
            -PappVersionName="$VERSION_NAME"

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nexustap-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
