apply plugin: 'com.android.application'

// Release signing credentials. Loaded from android/keystore.properties for local
// builds, or from environment variables in CI. Neither the keystore nor the
// properties file is committed — see android/.gitignore.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingProp = { String key, String env ->
    keystoreProperties.getProperty(key) ?: System.getenv(env)
}

def releaseStorePath = signingProp('storeFile', 'ANDROID_KEYSTORE_FILE')
def releaseStorePassword = signingProp('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingProp('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingProp('keyPassword', 'ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// Play rejects a re-used version code, so every upload needs a fresh one.
// CI passes -PappVersionCode=<run number>; local builds fall back to 1.
def resolvedVersionCode = (project.findProperty('appVersionCode') ?: System.getenv('ANDROID_VERSION_CODE') ?: '1') as Integer
def resolvedVersionName = project.findProperty('appVersionName') ?: System.getenv('ANDROID_VERSION_NAME') ?: '1.0'

android {
    namespace = "com.nexustap.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nexustap.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Leave unsigned rather than silently falling back to the debug key —
                // Play rejects debug-signed uploads, and a build failure is easier to
                // diagnose than a rejected upload.
                logger.warn("No release signing config found; :app:assembleRelease/bundleRelease will produce an UNSIGNED artifact.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
