apply plugin: 'com.android.application'

// Release signing material comes from android/keystore.properties (never committed)
// or, on CI, from ANDROID_KEYSTORE_* environment variables. When neither is present
// the release build stays unsigned so debug builds keep working locally.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String propertyKey, String envKey ->
    keystoreProperties.getProperty(propertyKey) ?: System.getenv(envKey)
}

def releaseStoreFile = signingValue("storeFile", "ANDROID_KEYSTORE_FILE")
def releaseStorePassword = signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "ANDROID_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()

android {
    namespace = "com.nexustap.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nexustap.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode is already used, so CI overrides
        // these with -PversionCode=... / -PversionName=... (or VERSION_CODE/VERSION_NAME).
        versionCode((project.findProperty("versionCode") ?: System.getenv("VERSION_CODE") ?: "1") as Integer)
        versionName(project.findProperty("versionName") ?: System.getenv("VERSION_NAME") ?: "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("No release keystore configured — the release build will be unsigned and Play will reject it. Create android/keystore.properties with storeFile/storePassword/keyAlias/keyPassword, or set the ANDROID_KEYSTORE_* environment variables.")
            }
            // The APK payload is web assets, not Java, so R8 buys almost nothing here
            // while risking the reflection-based Capacitor plugin bridge.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    bundle {
        // The UI ships inside the WebView assets, so per-language resource splits
        // would only strip strings the app still needs on some locales.
        language {
            enableSplit = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
